name: Apply progress bars update

on:
  push:
    branches:
      - agent/apply-progress-bars
    paths:
      - .github/workflows/apply-progress-bars.yml

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-progress-bars
          fetch-depth: 0
      - name: Apply tested patch
        run: git apply --check .github/codex-progress-bars.patch && git apply .github/codex-progress-bars.patch
      - name: Commit clean result
        run: |
          git rm .github/codex-progress-bars.patch .github/workflows/apply-progress-bars.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Affiche le pourcentage de tous les téléchargements"
          git push origin HEAD:agent/apply-progress-bars
