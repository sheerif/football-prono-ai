name: Apply navy gold theme

on:
  push:
    branches:
      - agent/apply-navy-gold-theme
    paths:
      - .github/workflows/apply-navy-gold-theme.yml

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preparation branch
        uses: actions/checkout@v4
        with:
          ref: agent/apply-navy-gold-theme
          fetch-depth: 0

      - name: Apply the validated theme patch
        shell: bash
        run: |
          base64 --decode .github/codex-navy-gold-theme.patch.gz.b64 | gzip --decompress > /tmp/codex-navy-gold-theme.patch
          git apply --check /tmp/codex-navy-gold-theme.patch
          git apply /tmp/codex-navy-gold-theme.patch
          rm .github/codex-navy-gold-theme.patch.gz.b64
          rm .github/workflows/apply-navy-gold-theme.yml

      - name: Commit and publish the result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Applique le thème bleu nuit et or"
          git push origin HEAD:agent/apply-navy-gold-theme
