name: Scheduled production data sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-production-data-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh upcoming fixtures and archive internal forecasts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      GITHUB_BACKUP_TOKEN: ${{ secrets.GITHUB_BACKUP_TOKEN }}
      GITHUB_BACKUP_REPOSITORY: sheerif/football-prono-ai
      GITHUB_BACKUP_BRANCH: database-backup
      DATABASE_URL: sqlite:///football.db
    steps:
      - name: Checkout application
        uses: actions/checkout@v7

      - name: Check required repository secrets
        id: config
        shell: bash
        run: |
          if [ -n "$API_FOOTBALL_KEY" ] && [ -n "$GITHUB_BACKUP_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sync skipped. Configure API_FOOTBALL_KEY and GITHUB_BACKUP_TOKEN in repository Actions secrets."
            {
              echo "## Synchronisation planifiée non exécutée"
              echo
              echo "Configurez les secrets Actions `API_FOOTBALL_KEY` et `GITHUB_BACKUP_TOKEN` pour activer l'archivage pré-match persistant."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore persistent SQLite database
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin \
            refs/heads/database-backup:refs/remotes/origin/database-backup
          if git cat-file -e origin/database-backup:football.db.gz 2>/dev/null; then
            git show origin/database-backup:football.db.gz > football.db.gz
          else
            git show origin/database-backup:football.db.manifest.json > football.db.manifest.json
            python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          manifest = json.loads(Path("football.db.manifest.json").read_text())
          archive = bytearray()
          for part in manifest["parts"]:
              data = subprocess.check_output(["git", "show", f"origin/database-backup:{part['path']}"])
              header = f"blob {len(data)}\0".encode("ascii")
              git_sha = hashlib.sha1(header + data).hexdigest()
              if len(data) != part["size_bytes"] or git_sha != part["git_blob_sha"]:
                  raise SystemExit(f"Fragment invalide: {part['path']}")
              archive.extend(data)
          if len(archive) != manifest["size_bytes"] or hashlib.sha256(archive).hexdigest() != manifest["sha256"]:
              raise SystemExit("Archive reconstituée invalide (taille/SHA-256).")
          Path("football.db.gz").write_bytes(archive)
          PY
          fi
          gzip -t football.db.gz
          gzip -dc football.db.gz > football.db
          test -s football.db
          sha256sum football.db.gz football.db

      - name: Set up Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies
        if: steps.config.outputs.configured == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Synchronize and archive pre-match forecasts
        if: steps.config.outputs.configured == 'true'
        run: python -m scripts.run_scheduled_sync
