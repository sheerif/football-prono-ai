name: Scheduled priority data sync and historical backfill

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-production-data-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Priority refresh (hourly) and resumable historical backfill
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
      GITHUB_BACKUP_REPOSITORY: sheerif/football-prono-ai
      GITHUB_BACKUP_BRANCH: database-backup
      DATABASE_URL: sqlite:///football.db
      FOOTBALL_FUNCTION_TRACE: "1"
      FOOTBALL_FUNCTION_TRACE_MAX_SPANS_PER_FUNCTION: "8"
    steps:
      - name: Checkout application
        uses: actions/checkout@v7

      - name: Check required repository secrets
        shell: bash
        run: |
          missing=()
          if [ -z "$API_FOOTBALL_KEY" ]; then
            missing+=("API_FOOTBALL_KEY")
          fi
          if [ -z "$BACKUP_TOKEN" ]; then
            missing+=("BACKUP_TOKEN")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Scheduled sync cannot run; missing required Actions secrets: %s\n' "${missing[*]}"
            {
              echo "## Synchronisation non exécutée"
              echo
              echo "Les secrets Actions requis sont manquants : ${missing[*]}."
              echo "Le workflow échoue explicitement au lieu de signaler une synchronisation verte mais ignorée."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Required secrets are configured."

      - name: Restore persistent SQLite database
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin \
            refs/heads/database-backup:refs/remotes/origin/database-backup
          if git cat-file -e origin/database-backup:football.db.gz 2>/dev/null; then
            git show origin/database-backup:football.db.gz > football.db.gz
          else
            git show origin/database-backup:football.db.manifest.json > football.db.manifest.json
            python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          manifest = json.loads(Path("football.db.manifest.json").read_text())
          archive = bytearray()
          for part in manifest["parts"]:
              data = subprocess.check_output(["git", "show", f"origin/database-backup:{part['path']}"])
              header = f"blob {len(data)}\0".encode("ascii")
              git_sha = hashlib.sha1(header + data).hexdigest()
              if len(data) != part["size_bytes"] or git_sha != part["git_blob_sha"]:
                  raise SystemExit(f"Fragment invalide: {part['path']}")
              archive.extend(data)
          if len(archive) != manifest["size_bytes"] or hashlib.sha256(archive).hexdigest() != manifest["sha256"]:
              raise SystemExit("Archive reconstituée invalide (taille/SHA-256).")
          Path("football.db.gz").write_bytes(archive)
          PY
          fi
          gzip -t football.db.gz
          gzip -dc football.db.gz > football.db
          test -s football.db
          sha256sum football.db.gz football.db

      - name: Verify restored SQLite integrity
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          path = Path("football.db")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("Base SQLite restaurée absente ou vide.")
          connection = sqlite3.connect(path)
          try:
              integrity = connection.execute("PRAGMA integrity_check").fetchone()
              if not integrity or integrity[0] != "ok":
                  raise SystemExit(f"SQLite integrity_check failed: {integrity}")
              tables = {
                  row[0] for row in connection.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }
              required = {"leagues", "teams", "matches", "standings"}
              missing = required - tables
              if missing:
                  raise SystemExit(f"Tables core manquantes après restauration: {sorted(missing)}")
              counts = {
                  name: int(connection.execute(f'SELECT COUNT(*) FROM "{name}"').fetchone()[0])
                  for name in sorted(required)
              }
          finally:
              connection.close()
          print("SQLite integrity_check: ok")
          print("Tables core présentes et base restaurée lisible.")
          print("Volumes core:", counts)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("## Restauration SQLite vérifiée\n\n")
                  summary.write("- PRAGMA integrity_check: ok\n")
                  summary.write("- Tables core: leagues, teams, matches, standings\n")
                  summary.write("- Volumes: " + ", ".join(f"{name}={count}" for name, count in counts.items()) + "\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Synchronize and archive pre-match forecasts
        run: python -m scripts.run_scheduled_sync
