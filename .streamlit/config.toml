[theme]
primaryColor = "#2AA198"
backgroundColor = "#F2F5F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0B2035"
font = "sans serif"

[client]
showSidebarNavigation = false

[server]
enableCORS = true
enableXsrfProtection = true
# Disable recursive file watching in deployed environments to avoid exhausting
# Linux inotify watch limits (Errno 28) on Streamlit Cloud.
fileWatcherType = "none"
